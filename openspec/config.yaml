schema: spec-driven

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - "Before drafting this proposal, make sure you're on a dedicated git branch for this change, named exactly like the change (e.g. `git checkout -b <change-name>` from main/master). Do not draft the proposal while on main."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Once all tasks are implemented and verified, bump the app version before finishing: run `npm version patch` for bug fixes or `npm version minor` for new features (this updates package.json and creates a commit + tag). If the change includes a breaking change, ask the user whether to use `npm version major` instead of guessing."
